[project]
name = "longvita-artemis-e2e"
version = "0.1.0"
description = "Automated E2E testing for Longvita Android App with Google ARTEMIS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "python-dotenv>=1.0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
python_files = ["test_*.py"]
