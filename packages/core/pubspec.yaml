name: longvita_core
description: Shared Longvita domain, Firestore services and Flutter design system.
publish_to: none
version: 1.0.0
environment:
  sdk: ^3.13.2
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cloud_firestore: 5.6.12
  firebase_analytics: 11.6.0
  firebase_remote_config: 5.5.0
  intl: 0.20.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Quicksand-OFL.txt
    - assets/fonts/Newsreader-OFL.txt
    - assets/fonts/Fraunces-OFL.txt
  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Variable.ttf
          weight: 400
        - asset: assets/fonts/Quicksand-Variable.ttf
          weight: 500
        - asset: assets/fonts/Quicksand-Variable.ttf
          weight: 600
        - asset: assets/fonts/Quicksand-Variable.ttf
          weight: 700
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Variable.ttf
          weight: 600
        - asset: assets/fonts/Newsreader-Variable.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 700
