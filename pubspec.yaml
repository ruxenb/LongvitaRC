name: longvita
description: "Longvita - Cloud-Enabled Mobile App for Longevity Nutrition (PRM393 Lab 3)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Architecture & State Management (MVVM + Provider)
  provider: ^6.1.2

  # Firebase Core & Services (Lab 3 Requirement)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.2
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_remote_config: ^5.1.3
  cloud_firestore: ^5.4.4

  # File Generation & Cloud Export
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.4

  # Networking & Utilities
  http: ^1.2.2
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/Quicksand-OFL.txt
    - assets/fonts/Newsreader-OFL.txt
    - assets/fonts/Fraunces-OFL.txt

  # Longvita design-system fonts (Figma Foundations 53:45), bundled from
  # google/fonts under SIL OFL 1.1 (licences in assets/fonts/*-OFL.txt).
  # Variable fonts are declared once per used weight so the engine never
  # synthesises bold; AppTypography sets the matching `wght` axis.
  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Variable.ttf
          weight: 400
        - asset: assets/fonts/Quicksand-Variable.ttf
          weight: 500
        - asset: assets/fonts/Quicksand-Variable.ttf
          weight: 600
        - asset: assets/fonts/Quicksand-Variable.ttf
          weight: 700
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Variable.ttf
          weight: 600
        - asset: assets/fonts/Newsreader-Variable.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 700
