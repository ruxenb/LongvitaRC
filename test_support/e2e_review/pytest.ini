[pytest]
addopts = -p pytester
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = .
markers =
    keep_app: original ARTEMIS case leaves the app running for a push
    signed_out: original ARTEMIS case starts on the sign-in screen
    signed_in: original ARTEMIS case starts signed in
    needs_account: original ARTEMIS case uses ARTEMIS_TEST_ACCOUNT
